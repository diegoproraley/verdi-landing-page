<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada — Verdi</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,800&family=Instrument+Sans:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
  .pagina-404{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem 1.5rem;
    background:var(--creme);
  }
  .pagina-404__logo{width:88px;height:auto;margin-bottom:1.6rem}
  .pagina-404__num{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(3rem,8vw,5.5rem);
    color:var(--verde-noite);
    line-height:1;
    margin:0 0 .6rem;
  }
  .pagina-404__texto{max-width:32rem;margin:0 0 2rem;color:var(--tinta-suave)}
  .pagina-404__acoes{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
  <main class="pagina-404">
    <img class="pagina-404__logo" src="img/logo-verdi-sm.jpg" alt="Verdi" width="320" height="321">
    <p class="pagina-404__num">404</p>
    <h1 class="titulo" style="font-size:clamp(1.4rem,3vw,1.9rem)">Essa página não existe.</h1>
    <p class="pagina-404__texto">
      O endereço que você tentou abrir não foi encontrado. Talvez o link esteja
      desatualizado — volte para a página inicial para ver o cardápio e fazer
      sua encomenda.
    </p>
    <div class="pagina-404__acoes">
      <a class="btn btn--verde" href="/">Voltar para a Verdi</a>
      <a class="btn btn--vazado" href="https://wa.me/5569992999008?text=Ol%C3%A1%2C%20Verdi%21%20Cheguei%20por%20um%20link%20que%20n%C3%A3o%20funcionou.">Falar no WhatsApp</a>
    </div>
  </main>
</body>
</html>
